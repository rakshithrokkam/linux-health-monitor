# Thresholds and settings for health_check.sh
# Values are plain shell variables; remove a line to use the built-in default.

# Disk usage per filesystem (% used)
DISK_WARN=80
DISK_CRIT=90

# Memory usage (% used, calculated from MemAvailable) and swap
MEM_WARN=80
MEM_CRIT=90
SWAP_WARN=50
SWAP_CRIT=80

# 1-minute load average divided by CPU count
LOAD_WARN_PER_CPU=0.8
LOAD_CRIT_PER_CPU=1.5

# Warn when this many zombie processes exist
ZOMBIE_WARN=5

# Processes that must be running (space-separated, exact names). Example: "sshd cron nginx"
PROC_WATCHLIST=""

# How many top CPU consumers to log each run
TOP_N=5

# Where logs are written
# LOG_DIR=/var/log/health_check

# Rotate each log when it reaches this many bytes; retain numbered old logs.
LOG_MAX_BYTES=10485760
LOG_KEEP=5
